<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>荐股看板</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --txt: #e6e9ef;
    --dim: #8a93a6; --green: #2ecc71; --red: #ff5c5c; --accent: #4c8dff;
    --chip: #222836;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { padding: 14px 16px 8px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0 0 4px; }
  #status { color: var(--dim); font-size: 12px; }
  #error {
    display: none; margin: 16px; padding: 14px 16px; border-radius: 10px;
    background: #2a1416; border: 1px solid #5a2327; color: #ffd7d7;
  }
  #error button {
    margin-top: 10px; background: var(--accent); color: #fff; border: 0;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  #controls {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 10px 16px; position: sticky; top: 0; background: var(--bg);
    border-bottom: 1px solid var(--line); z-index: 5;
  }
  #controls select, #controls input {
    background: var(--panel); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none;
  }
  #controls input { flex: 1; min-width: 120px; }
  .count { color: var(--dim); font-size: 12px; }
  /* fixed 布局已保证整表适配视口宽度，无需横向滚动容器；
     去掉 overflow 容器，粘性表头才能相对视口正确吸顶（否则会被滚动容器吞掉）。 */
  .wrap { overflow: visible; }
  /* border-collapse:separate 修复粘性 <th> 在 Chrome/Safari 不绘制（表头“消失”）的已知 bug */
  table { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
  th, td { padding: 6px 6px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; white-space: normal; overflow-wrap: break-word; word-break: break-word; }
  th { color: var(--dim); font-weight: 600; font-size: 11px; line-height: 1.25; cursor: pointer; user-select: none; position: sticky; top: var(--head-top, 53px); z-index: 2; background: var(--bg); }
  th .arrow { color: var(--accent); }
  th .sorthint { opacity: .35; font-size: 9px; margin-left: 2px; }
  td { font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; }
  .tk { font-weight: 700; }
  .nm { color: var(--dim); font-size: 10px; display: block; margin-top: 2px; }
  .reason { color: #c7cedd; font-size: 11px; }
  .biz { color: #aeb6c4; font-size: 11px; line-height: 1.35; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--chip); font-size: 11px; color: var(--txt); }
  /* 策略 chip（三策略 Agent） */
  .s-value { background: #15324d; color: #8cc6ff; }
  .s-growth { background: #3a2f12; color: #f0d27f; }
  .s-vc { background: #2a1f3d; color: #cda8ff; }
  .zone-in { color: var(--green); font-weight: 600; }
  .zone-below { color: var(--red); font-weight: 600; }
  .zone-above { color: var(--dim); }
  .live-dot { color: var(--accent); font-size: 10px; } /* 实时推算的买区 */
  /* 底部平均行：吸底常显，等权统计当前筛选出的行 */
  tfoot td {
    position: sticky; bottom: 0; background: var(--panel);
    border-top: 2px solid var(--accent); border-bottom: none;
    font-size: 12px; font-weight: 600; z-index: 3;
  }
  tfoot .avg-lbl { color: var(--dim); font-weight: 600; }
  /* 动态更新 */
  #updates { padding: 8px 16px 40px; }
  #updates h2 { font-size: 14px; color: var(--dim); margin: 16px 0 8px; }
  #watch { padding: 8px 16px 0; }
  #watch h2 { font-size: 14px; color: var(--dim); margin: 16px 0 8px; }
  /* 🔬 个股归因区块（全池固定分组，与 reports/attribution-stock-level.md 同源） */
  #attrib { padding: 8px 16px 0; }
  #attrib h2 { font-size: 14px; color: var(--dim); margin: 16px 0 6px; }
  #attrib h3 { font-size: 12px; color: var(--dim); margin: 14px 0 6px; font-weight: 600; }
  #attrib .mp-tiles { margin-top: 6px; }
  .hist { display: flex; align-items: flex-end; gap: 3px; height: 72px; margin: 18px 0 2px; }
  .hist .bar { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; opacity: .85; }
  .hist .bar.neg { background: var(--red); } .hist .bar.pos { background: var(--green); }
  .hist .bar .n { position: absolute; top: -14px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--dim); }
  .hist-x { display: flex; gap: 3px; font-size: 9px; color: var(--dim); } .hist-x span { flex: 1; text-align: center; }
  .attrib-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 900px) { .attrib-grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1200px) { .attrib-grid-3 { grid-template-columns: 1fr 1fr 1fr; } }
  .attrib-tbl h3 { margin-top: 10px; }
  .attrib-tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .attrib-tbl table { table-layout: auto; min-width: 420px; }
  .attrib-tbl th { position: static; cursor: default; }
  .attrib-tbl td.num, .attrib-tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .wrow { display:flex; gap:8px; padding:5px 0; font-size:13px; line-height:1.5; border-bottom:1px solid rgba(128,128,128,.12); }
  .wrow .tk { font-weight:600; min-width:52px; }
  .wrow .fired { color:#e05c4b; font-weight:600; }
  .wrow .near { color:#d99a20; }
  .wrow .info { color: var(--dim); }
  .cond-chip { margin-left:4px; font-size:10px; }
  .cond-note { display:block; color:#d99a20; }
  .upd { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .upd .d { color: var(--dim); font-size: 11px; min-width: 74px; }
  .upd .t { flex: 1; }
  .upd a { color: var(--accent); text-decoration: none; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; margin-right: 6px; }
  .b-new_rec { background: #15324d; color: #8cc6ff; }
  .b-buy_alert { background: #14402a; color: #7ff0b0; }
  .b-milestone { background: #3a2f12; color: #f0d27f; }
  .b-falsification { background: #4a1620; color: #ff9aa8; }
  .b-influencer_pick { background: #2a1f3d; color: #cda8ff; }
  .b-cross_lane { background: #123a3a; color: #7fe0d8; }
  .b-dev_news { background: #232a38; color: #aab6cc; }
  /* ---------- Tab 导航 ---------- */
  #tabs { display: flex; gap: 6px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); }
  .tab {
    padding: 7px 16px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px;
    color: var(--dim); background: transparent; border: 1px solid transparent; border-bottom: none;
    user-select: none;
  }
  .tab.active { background: var(--panel); color: var(--txt); border-color: var(--line); font-weight: 600; }
  /* ---------- Model Portfolio ---------- */
  #portfolio { display: none; padding: 12px 16px 40px; }
  #portfolio h2 { font-size: 14px; color: var(--dim); margin: 14px 0 8px; }
  #portfolio h3 { font-size: 12px; color: var(--dim); margin: 12px 0 6px; font-weight: 600; }
  .mp-meta { color: var(--dim); font-size: 12px; margin: 2px 0 10px; line-height: 1.6; }
  .mp-chartbox { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px 4px; }
  .mp-legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 4px 8px 8px; font-size: 12px; color: var(--dim); }
  .mp-legend .sw { display: inline-block; width: 22px; height: 0; border-top: 2.5px solid; vertical-align: middle; margin-right: 5px; }
  .mp-tip {
    display: none; position: absolute; pointer-events: none; z-index: 6;
    background: #1d222c; border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font-size: 12px; line-height: 1.55; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .mp-tip .d { color: var(--dim); font-size: 11px; }
  .mp-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  @media (min-width: 560px) { .mp-tiles { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 900px) { .mp-tiles { grid-template-columns: repeat(6, 1fr); } }
  .mp-tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; }
  .mp-tile .lbl { color: var(--dim); font-size: 11px; }
  .mp-tile .val { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .mp-tile .sub { color: var(--dim); font-size: 10px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  #mp-holdings { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #mp-holdings table { table-layout: auto; min-width: 560px; }
  #mp-holdings th { position: static; }
  @media (max-width: 560px) {
    body { font-size: 13px; }
  }
  /* 口令输入层：替代 window.prompt（原生 prompt 无法掩码输入） */
  #gate {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: var(--bg); align-items: center; justify-content: center;
  }
  #gate form {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 20px; width: min(320px, calc(100vw - 48px));
  }
  #gate label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 10px; }
  #gate input {
    width: 100%; background: var(--bg); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 12px; font-size: 14px; outline: none;
  }
  #gate input:focus { border-color: var(--accent); }
  #gate button {
    margin-top: 12px; width: 100%; background: var(--accent); color: #fff; border: 0;
    padding: 9px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>荐股看板</h1>
  <div id="status">加载中…</div>
</header>

<div id="error"></div>

<div id="gate">
  <form id="gate-form">
    <label for="gate-input">请输入看板口令</label>
    <input id="gate-input" type="password" autocomplete="current-password">
    <button type="submit">进入</button>
  </form>
</div>

<div id="tabs" style="display:none">
  <div class="tab active" id="tab-stocks">📋 荐股</div>
  <div class="tab" id="tab-portfolio">📈 组合</div>
</div>

<div id="portfolio">
  <div class="mp-meta" id="mp-meta"></div>
  <div class="mp-chartbox">
    <div class="mp-legend" id="mp-legend"></div>
    <div id="mp-chart"></div>
    <div class="mp-tip" id="mp-tip"></div>
  </div>
  <div class="mp-tiles" id="mp-tiles"></div>
  <h2>当前持仓（双周调仓 · 隔周五收盘）</h2>
  <div id="mp-holdings"></div>
  <h2>收益归因（自 2026-05-01 回测起点，含回测段）</h2>
  <div class="mp-meta" id="mp-attrib-meta"></div>
  <div id="mp-attrib"></div>
</div>

<div class="mp-meta" id="stocks-note" style="display:none; padding:8px 16px 0; margin:0">口径：全池等权 buy-and-hold，自各票推荐日起算（≠ 组合 top-15 双周调仓口径，见「📈 组合」tab）</div>

<div id="controls" style="display:none">
  <select id="strategyFilter"><option value="">全部策略</option></select>
  <select id="typeFilter"><option value="">全部板块</option></select>
  <select id="channelFilter" title="来源渠道：推荐日归因（推荐日及前 7 天的 sourcing 路由渠道，否则「自筛」）"><option value="">全部渠道</option></select>
  <select id="dateFilter">
    <option value="">全部时间</option>
    <option value="7">最近 7 天</option>
    <option value="14">最近 14 天</option>
    <option value="30">最近 30 天</option>
    <option value="90">最近 90 天</option>
  </select>
  <input id="search" type="search" placeholder="搜索代码 / 公司 / 理由">
  <span class="count" id="count"></span>
</div>

<div class="wrap"><table id="tbl" style="display:none">
  <thead><tr id="head"></tr></thead>
  <tbody id="body"></tbody>
  <tfoot id="foot"></tfoot>
</table></div>

<div id="attrib" style="display:none">
  <h2>🔬 个股归因</h2>
  <div class="mp-meta" id="attrib-meta"></div>
  <h3>① 收益离散度（正式推荐，推荐日至今）</h3>
  <div class="mp-tiles" id="attrib-tiles"></div>
  <div id="attrib-hist"></div>
  <h3>② 来源渠道（推荐日归因）</h3>
  <div class="attrib-tbl" id="attrib-channel"></div>
  <h3>③ 时间窗：按推荐月 cohort ／ 按日历月已入池票当月收益（* = 未完整月）</h3>
  <div class="attrib-grid">
    <div class="attrib-tbl" id="attrib-cohort"></div>
    <div class="attrib-tbl" id="attrib-calendar"></div>
  </div>
</div>

<div id="watch" style="display:none">
  <h2>👀 观察名单（触发价/时点到位自动复评）</h2>
  <div id="watchfeed"></div>
</div>

<div id="updates" style="display:none">
  <h2>动态更新</h2>
  <div id="feed"></div>
</div>

<script>
"use strict";

// ---------- 工具 ----------
function $(id){ return document.getElementById(id); }
// 让粘性表头精确吸在 controls 栏下沿（controls 在窄屏会换行变高，故按实测高度算）
function syncHeadTop(){
  var c = $("controls");
  var h = (c && c.offsetHeight) ? c.offsetHeight : 53;
  document.documentElement.style.setProperty("--head-top", h + "px");
}
function showError(msg, withRetry){
  var e = $("error");
  e.textContent = msg;
  if (withRetry){
    var b = document.createElement("button");
    b.textContent = "重新输入口令";
    b.onclick = function(){ sessionStorage.removeItem("dash_pp"); location.reload(); };
    e.appendChild(document.createElement("br"));
    e.appendChild(b);
  }
  e.style.display = "block";
}
function b64ToBytes(b64){
  var bin = atob(b64), u = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
function fmtPct(x){
  if (x === null || x === undefined || isNaN(x)) return "—";
  var v = x*100, s = (v>=0?"+":"") + v.toFixed(1) + "%";
  return s;
}
function fmtMoney(x, cur){
  if (x === null || x === undefined || isNaN(x)) return "—";
  return (cur || "$") + Number(x).toFixed(2);
}
function pctClass(x){ return (x>=0) ? "pos" : "neg"; }
function isCond(s){ return ((s.tier||"").indexOf("条件") === 0); }
// 推荐日 -> 截止日 的自然日数（截止日取 meta.data_as_of，缺失退回今天）
var AS_OF = null;
function parseYMD(s){
  if (!s) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
}
function daysSinceRec(recDate){
  var a = parseYMD(recDate); if (!a) return null;
  var b = parseYMD(AS_OF) || new Date();
  var d = Math.round((b - a) / 86400000);
  return d >= 0 ? d : null;
}

// ---------- 解密 ----------
async function deriveKey(passphrase, salt, iterations){
  var enc = new TextEncoder();
  var km = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt: salt, iterations: iterations, hash:"SHA-256" },
    km,
    { name:"AES-GCM", length:256 },
    false, ["decrypt"]
  );
}
async function decryptEnvelope(env, passphrase){
  var salt = b64ToBytes(env.kdf.salt);
  var iv = b64ToBytes(env.iv);
  var ct = b64ToBytes(env.ct);
  var key = await deriveKey(passphrase, salt, env.kdf.iterations || 250000);
  var pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv: iv }, key, ct);
  return new TextDecoder().decode(pt);
}

// ---------- 表格 ----------
// 默认：买区状态排序（在买区置顶，组内 Depth 高者优先）
var STOCKS = [], sortKey = "buy_zone", sortDir = 1;

// 三策略 Agent（💎价值 / 🚀高成长 / 🎲VC）
var STRATEGY_META = {
  "价值":   { emoji: "💎", cls: "s-value" },
  "高成长": { emoji: "🚀", cls: "s-growth" },
  "VC":     { emoji: "🎲", cls: "s-vc" }
};
var STRATEGY_ORDER = ["价值", "高成长", "VC"];

function zoneRank(s){
  var st = (s.buy_zone && s.buy_zone.status) || "";
  return st.indexOf("在买区")>=0 ? 0 : (st.indexOf("跌破")>=0 ? 1 : (st ? 2 : 3));
}

var COLS = [
  { key:"ticker", label:"代码/公司", w:"9%", sort:function(s){return s.ticker||"";},
    cell:function(s,td){
      var a = document.createElement("span"); a.className="tk"; a.textContent = s.ticker||"—"; td.appendChild(a);
      if (isCond(s)){
        var b = document.createElement("span"); b.className="chip cond-chip"; b.textContent = "🟡条件";
        b.title = "条件推荐：触发限价/事件前不建仓。业绩按推荐时股价起算（限价 ≠ 推荐时股价）。";
        td.appendChild(b);
      }
      if (s.name){ var n=document.createElement("span"); n.className="nm"; n.textContent=s.name; td.appendChild(n); }
      if (isCond(s) && s.cond_price){
        var cp=document.createElement("span"); cp.className="nm cond-note"; cp.textContent="限价 "+s.cond_price; td.appendChild(cp);
      }
    }},
  { key:"strategy", label:"策略", w:"7%", sort:function(s){return s.strategy||"";},
    cell:function(s,td){
      var st = s.strategy||"";
      var meta = STRATEGY_META[st];
      var c=document.createElement("span");
      c.className = "chip" + (meta ? " "+meta.cls : "");
      c.textContent = meta ? meta.emoji+" "+st : (st||"—");
      td.appendChild(c);
    }},
  { key:"business", label:"核心业务", w:"10%", sort:function(s){return s.business||"";},
    cell:function(s,td){ td.className="biz"; td.textContent = s.business||"—"; }},
  { key:"sector", label:"板块", w:"7%", sort:function(s){return s.sector||s.type||"";},
    cell:function(s,td){ var c=document.createElement("span"); c.className="chip"; c.textContent=s.sector||s.type||"—"; td.appendChild(c); }},
  { key:"depth", label:"Depth", w:"4%", num:true, sort:function(s){return s.depth;},
    cell:function(s,td){ td.classList.add("num"); td.textContent = (s.depth==null?"—":s.depth); }},
  { key:"rec_date", label:"推荐日", w:"8%", desc:true, sort:function(s){return s.rec_date||"";},
    cell:function(s,td){
      td.textContent = s.rec_date||"—";
      var dd = daysSinceRec(s.rec_date);
      if (dd!=null){ var n=document.createElement("span"); n.className="nm"; n.textContent="持有 "+dd+" 天"; td.appendChild(n); }
    }},
  { key:"chg_vs_rec", label:"现价 (较荐)", w:"10%", num:true, sort:function(s){return s.chg_vs_rec;},
    cell:function(s,td){
      td.classList.add("num");
      td.appendChild(document.createTextNode(fmtMoney(s.last_price, s.currency)));
      if (s.chg_vs_rec!=null){ var c=document.createElement("span"); c.className=pctClass(s.chg_vs_rec); c.textContent=" "+fmtPct(s.chg_vs_rec); td.appendChild(c); }
      var sub=document.createElement("span"); sub.className="nm"; sub.textContent="荐 "+fmtMoney(s.rec_price, s.currency); td.appendChild(sub);
    }},
  { key:"upside", label:"目标 (上行)", w:"8%", num:true, sort:function(s){return s.upside;},
    cell:function(s,td){
      td.classList.add("num");
      td.appendChild(document.createTextNode(fmtMoney(s.target, s.currency)));
      if (s.upside!=null){ var c=document.createElement("span"); c.className=pctClass(s.upside); c.textContent=" "+fmtPct(s.upside); td.appendChild(c); }
      if (s.target_updated){
        var u=document.createElement("span"); u.className="nm"; u.textContent="月更 "+s.target_updated.slice(5);
        u.title="目标价经月度刷新（初始目标价锁定，业绩追踪不受影响）"; td.appendChild(u);
      }
    }},
  { key:"fwd_pe", label:"PE/PEG", w:"6%", num:true, sort:function(s){return s.fwd_pe;},

function buildHead(){
  var tr = $("head");
  tr.textContent = "";
  COLS.forEach(function(col){
    var th = document.createElement("th");
    if (col.w) th.style.width = col.w;
    th.textContent = col.label;
    if (col.key === sortKey){
      var ar = document.createElement("span"); ar.className="arrow"; ar.textContent = sortDir<0 ? " ↓" : " ↑";
      th.appendChild(ar);
    } else {
      var hint = document.createElement("span"); hint.className="sorthint"; hint.textContent="⇅";
      th.appendChild(hint);
    }
    th.onclick = function(){
      if (sortKey === col.key){ sortDir = -sortDir; }
      // 日期列首次点击就给「最新→最老」（desc:true），数值列同理降序
      else { sortKey = col.key; sortDir = (col.num || col.desc) ? -1 : 1; }
      buildHead(); renderBody();
    };
    tr.appendChild(th);
  });
}

// 来源渠道：档案缺「来源渠道」行 -> 「未标注」（回填后不应出现）
function channelOf(s){ return s.source_channel || "未标注"; }

function currentRows(){
  var t = $("typeFilter").value;
  var st = $("strategyFilter").value;
  var ch = $("channelFilter").value;
  var dr = $("dateFilter").value;
  var q = ($("search").value||"").trim().toLowerCase();
  var col = COLS.filter(function(c){return c.key===sortKey;})[0] || COLS[0];
  var rows = STOCKS.filter(function(s){
    if (st && (s.strategy||"") !== st) return false;
    if (t && (s.sector||s.type) !== t) return false;
    if (ch && channelOf(s) !== ch) return false;
    if (dr){
      // 与「持有 N 天」同口径（锚定 data_as_of 而非浏览器本地日期）；无推荐日的行不算「最近」
      var dd = daysSinceRec(s.rec_date);
      if (dd == null || dd > Number(dr)) return false;
    }
    if (q){
      var hay = ((s.ticker||"")+" "+(s.name||"")+" "+(s.business||"")+" "+(s.reason||"")).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  rows.sort(function(a,b){
    var va = col.sort(a), vb = col.sort(b);
    var na = (va===null||va===undefined||va===""), nb = (vb===null||vb===undefined||vb==="");
    if (na && nb) return 0;
    if (na) return 1;       // null 永远排后
    if (nb) return -1;
    if (va < vb) return -1*sortDir;
    if (va > vb) return 1*sortDir;
    return 0;
  });
  return rows;
}

function renderBody(){
  var rows = currentRows();
  var body = $("body");
  body.textContent = "";
  rows.forEach(function(s){
    var tr = document.createElement("tr");
    COLS.forEach(function(col){
      var td = document.createElement("td");
      try { col.cell(s, td); } catch(e){ td.textContent = "—"; }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  renderFoot(rows);
  $("count").textContent = rows.length + " / " + STOCKS.length + " 只";
}

// 等权平均：对当前筛选出的行取某字段的均值，忽略缺值
function avgOf(rows, pick){
  var xs = [];
  rows.forEach(function(s){ var v = pick(s); if (v!=null && !isNaN(v)) xs.push(v); });
  if (!xs.length) return null;
  var sum = 0; xs.forEach(function(v){ sum += v; });
  return { mean: sum/xs.length, n: xs.length };
}

// 底部「平均」行：从推荐至今的等权平均涨跌幅 + 平均上行空间
function renderFoot(rows){
  var foot = $("foot");
  foot.textContent = "";
  if (!rows.length) return;
  var tr = document.createElement("tr");
  COLS.forEach(function(col){
    var td = document.createElement("td");
    if (col.key === "ticker"){
      var l = document.createElement("span"); l.className="avg-lbl"; l.textContent="平均"; td.appendChild(l);
      var n = document.createElement("span"); n.className="nm"; n.textContent=rows.length+" 只"; td.appendChild(n);
    } else if (col.key === "rec_date"){
      var dz = avgOf(rows, function(s){ return daysSinceRec(s.rec_date); });
      if (dz){
        td.appendChild(document.createTextNode("持有 "+Math.round(dz.mean)+" 天"));
        var sub=document.createElement("span"); sub.className="nm"; sub.textContent="均"; td.appendChild(sub);
      } else td.textContent="—";
    } else if (col.key === "chg_vs_rec"){
      td.classList.add("num");
      // 均值只计正式推荐；🟡 条件推荐（还在等触发价）单独列，避免拖歪组均值
      var formal = rows.filter(function(s){ return !isCond(s); });
      var conds  = rows.filter(isCond);
      var a = avgOf(formal, function(s){ return s.chg_vs_rec; });
      if (a){
        var c=document.createElement("span"); c.className=pctClass(a.mean); c.textContent=fmtPct(a.mean); td.appendChild(c);
        var sub=document.createElement("span"); sub.className="nm"; sub.textContent=a.n+" 只计入"; td.appendChild(sub);
      } else td.textContent="—";
      var ca = avgOf(conds, function(s){ return s.chg_vs_rec; });
      if (ca){
        var c2=document.createElement("span"); c2.className="nm"; c2.textContent="🟡条件均 "+fmtPct(ca.mean)+" ("+ca.n+")"; td.appendChild(c2);
      }
    } else if (col.key === "upside"){
      td.classList.add("num");
      var u = avgOf(rows, function(s){ return s.upside; });
      if (u){ var c=document.createElement("span"); c.className=pctClass(u.mean); c.textContent=fmtPct(u.mean); td.appendChild(c); }
      else td.textContent="—";
    }
    tr.appendChild(td);
  });
  foot.appendChild(tr);
}

var WATCH_VISIBLE = false;

function svgEl(tag, attrs){
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function renderPortfolio(mp){
  if (!mp || !mp.nav_series || !mp.nav_series.length){
    $("mp-meta").textContent = "组合数据暂不可用（等下一次数据刷新）。";
    return;
  }
  // ---- meta 行 ----
  var meta = [];
  meta.push("策略：" + (mp.strategy||""));
  meta.push("数据截至 " + (mp.as_of||"—"));
  meta.push("上次调仓 " + (mp.last_rebalance||"—"));
  if (mp.n_holdings != null){
    var hold = "持仓 " + mp.n_holdings + "/15";
    if (mp.cash_weight > 0.001) hold += " · 现金 " + (mp.cash_weight*100).toFixed(1) + "%（正预期收益标的不足 15 只，不硬凑）";
    meta.push(hold);
  }
  meta.push("虚线 = 回测（≤ " + mp.live_anchor + "），实线 = 实盘模拟");
  $("mp-meta").textContent = meta.join(" · ");

  // ---- 数据准备（统一转成 {t(ms), v(指数=100)}）----
  function toPts(arr){
    var out = [];
    (arr||[]).forEach(function(p){
      var d = parseYMD(p.date);
      if (d && p.nav != null) out.push({ t: d.getTime(), v: p.nav * 100, date: p.date });
    });
    return out;
  }
  var port = toPts(mp.nav_series);
  var spy = toPts((mp.benchmarks||{}).SPY);
  var qqq = toPts((mp.benchmarks||{}).QQQ);
  var anchorT = parseYMD(mp.live_anchor).getTime();

  // ---- 比例尺 ----
  var W = 820, H = 300, L = 44, R = 12, T = 12, B = 24;
  var allPts = port.concat(spy).concat(qqq);
  var tMin = Infinity, tMax = -Infinity, vMin = Infinity, vMax = -Infinity;
  allPts.forEach(function(p){
    if (p.t < tMin) tMin = p.t; if (p.t > tMax) tMax = p.t;
    if (p.v < vMin) vMin = p.v; if (p.v > vMax) vMax = p.v;
  });
  var vPad = (vMax - vMin) * 0.07 || 1;
  vMin -= vPad; vMax += vPad;
  function X(t){ return L + (t - tMin) / (tMax - tMin) * (W - L - R); }
  function Y(v){ return T + (vMax - v) / (vMax - vMin) * (H - T - B); }
  function path(pts){
    return pts.map(function(p,i){ return (i?"L":"M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1); }).join(" ");
  }

  var svg = svgEl("svg", { viewBox: "0 0 "+W+" "+H, width: "100%", height: "auto", "font-family": "inherit" });

  // 网格 + y 轴刻度
  var step = (vMax - vMin) / 4;
  for (var i=0;i<=4;i++){
    var v = vMin + step*i, y = Y(v);
    svg.appendChild(svgEl("line", { x1:L, y1:y, x2:W-R, y2:y, stroke:"#262b36", "stroke-width":1 }));
    var lb = svgEl("text", { x:L-6, y:y+4, "text-anchor":"end", fill:"#8a93a6", "font-size":10 });
    lb.textContent = Math.round(v);
    svg.appendChild(lb);
  }
  // 100 基线
  if (vMin < 100 && vMax > 100)
    svg.appendChild(svgEl("line", { x1:L, y1:Y(100), x2:W-R, y2:Y(100), stroke:"#3a4152", "stroke-width":1, "stroke-dasharray":"1 3" }));
  // x 轴日期刻度（约 5 个）
  var nTicks = 5;
  for (var j=0;j<nTicks;j++){
    var tt = tMin + (tMax - tMin) * j/(nTicks-1);
    var near = port.reduce(function(a,p){ return Math.abs(p.t-tt) < Math.abs(a.t-tt) ? p : a; }, port[0]);
    var xl = svgEl("text", { x:X(near.t), y:H-8, "text-anchor": j===0?"start":(j===nTicks-1?"end":"middle"), fill:"#8a93a6", "font-size":10 });
    xl.textContent = near.date.slice(5);
    svg.appendChild(xl);
  }
  // 回测/实盘分界线
  if (anchorT > tMin && anchorT < tMax){
    svg.appendChild(svgEl("line", { x1:X(anchorT), y1:T, x2:X(anchorT), y2:H-B, stroke:"#3a4152", "stroke-width":1, "stroke-dasharray":"3 3" }));
    // 分界线贴近右缘时标签放到线左侧，避免被裁切
    var onRight = X(anchorT) < (W - R) * 0.8;
    var bl = svgEl("text", { x:X(anchorT) + (onRight ? 4 : -4), y:T+10, fill:"#8a93a6", "font-size":10,
                             "text-anchor": onRight ? "start" : "end" });
    bl.textContent = onRight ? "▶ 实盘模拟" : "实盘模拟 ▶";
    svg.appendChild(bl);
  }
  // 基准线（中性灰，线型区分）
  if (spy.length) svg.appendChild(svgEl("path", { d:path(spy), fill:"none", stroke:"#898781", "stroke-width":1.5 }));
  if (qqq.length) svg.appendChild(svgEl("path", { d:path(qqq), fill:"none", stroke:"#898781", "stroke-width":1.5, "stroke-dasharray":"2 4", "stroke-linecap":"round" }));
  // 组合：虚线回测段 + 实线实盘段（共享 anchor 点）
  var back = port.filter(function(p){ return p.t <= anchorT; });
  var live = port.filter(function(p){ return p.t >= anchorT; });
  if (back.length) svg.appendChild(svgEl("path", { d:path(back), fill:"none", stroke:"#3987e5", "stroke-width":2.4, "stroke-dasharray":"7 5", "stroke-linecap":"round" }));
  if (live.length > 1) svg.appendChild(svgEl("path", { d:path(live), fill:"none", stroke:"#3987e5", "stroke-width":2.6, "stroke-linecap":"round" }));
  // 末点标记
  var lastP = port[port.length-1];
  svg.appendChild(svgEl("circle", { cx:X(lastP.t), cy:Y(lastP.v), r:3.5, fill:"#3987e5" }));

  // ---- hover 十字线 + tooltip ----
  var cross = svgEl("line", { x1:0, y1:T, x2:0, y2:H-B, stroke:"#8a93a6", "stroke-width":1, "stroke-dasharray":"2 2", visibility:"hidden" });
  svg.appendChild(cross);
  var overlay = svgEl("rect", { x:L, y:T, width:W-L-R, height:H-T-B, fill:"transparent" });
  svg.appendChild(overlay);
  var tip = $("mp-tip"), box = $("mp-chart");
  function nearestIdx(t){
    var best = 0, bd = Infinity;
    for (var i=0;i<port.length;i++){ var d = Math.abs(port[i].t - t); if (d < bd){ bd = d; best = i; } }
    return best;
  }
  function lookup(arr, date){
    for (var i=0;i<arr.length;i++) if (arr[i].date === date) return arr[i].v;
    return null;
  }
  function onMove(ev){
    var rect = svg.getBoundingClientRect();
    var sx = W / rect.width;
    var vx = (ev.clientX - rect.left) * sx;
    var t = tMin + (vx - L) / (W - L - R) * (tMax - tMin);
    var p = port[nearestIdx(t)];
    cross.setAttribute("x1", X(p.t)); cross.setAttribute("x2", X(p.t));
    cross.setAttribute("visibility", "visible");
    var rows = ['<span class="d">' + p.date + (p.t <= anchorT ? " · 回测" : " · 实盘模拟") + "</span>"];
    rows.push("组合 <b>" + fmtPct(p.v/100 - 1) + "</b>");
    var sv = lookup(spy, p.date); if (sv != null) rows.push("SPY " + fmtPct(sv/100 - 1));
    var qv = lookup(qqq, p.date); if (qv != null) rows.push("QQQ " + fmtPct(qv/100 - 1));
    tip.innerHTML = rows.join("<br>");
    tip.style.display = "block";
    var bx = box.getBoundingClientRect();
    var px = (X(p.t) / sx) + (rect.left - bx.left);
    var flip = px > bx.width * 0.62;
    tip.style.left = flip ? "" : (px + 12) + "px";
    tip.style.right = flip ? (bx.width - px + 12) + "px" : "";
    tip.style.top = "30px";
  }
  overlay.addEventListener("pointermove", onMove);
  overlay.addEventListener("pointerdown", onMove);
  overlay.addEventListener("pointerleave", function(){
    cross.setAttribute("visibility", "hidden"); tip.style.display = "none";
  });

  box.textContent = "";
  box.appendChild(svg);

  // ---- 图例 ----
  var lg = $("mp-legend");
  lg.textContent = "";
  [["#3987e5","solid","组合（虚=回测 实=模拟）"],["#898781","solid","SPY"],["#898781","dotted","QQQ"]].forEach(function(it){
    var s = document.createElement("span");
    var sw = document.createElement("span"); sw.className = "sw";
    sw.style.borderTopColor = it[0]; sw.style.borderTopStyle = it[1];
    s.appendChild(sw); s.appendChild(document.createTextNode(it[2]));
    lg.appendChild(s);
  });

  // ---- 指标卡 ----
  var tiles = $("mp-tiles");
  tiles.textContent = "";
  var mFull = (mp.metrics||{}).full || {};
  var mLive = (mp.metrics||{}).live;
  function tile(label, val, cls, sub){ makeTile(tiles, label, val, cls, sub); }
  function liveSub(pick){
    return (mLive && pick(mLive) != null) ? "实盘段 " + pick(mLive) : null;
  }
  function cls(x){ return x != null ? pctClass(x) : null; }
  tile("累计收益（全期）", fmtPct(mFull.cum), cls(mFull.cum), liveSub(function(m){ return fmtPct(m.cum); }));
  tile("年化", fmtPct(mFull.ann), cls(mFull.ann), "样本短，仅供参考");
  tile("最大回撤", mFull.max_dd != null ? "-" + (mFull.max_dd*100).toFixed(1) + "%" : "—", mFull.max_dd != null ? "neg" : null, null);
  tile("周胜率", mFull.win != null ? (mFull.win*100).toFixed(0) + "%" : "—", null, mFull.n_periods != null ? mFull.n_periods + " 个区间" : null);
  tile("Sharpe（年化）", mFull.sharpe != null ? mFull.sharpe.toFixed(2) : "—", null, "rf=" + (mp.rf_annual_pct != null ? mp.rf_annual_pct + "%" : "—"));
  tile("超额 vs SPY", fmtPct(mFull.excess_spy), cls(mFull.excess_spy), liveSub(function(m){ return fmtPct(m.excess_spy); }));

  // ---- 持仓明细 ----
  var hbox = $("mp-holdings");
  hbox.textContent = "";
  var tb = document.createElement("table");
  var thead = document.createElement("thead");
  var htr = document.createElement("tr");
  ["代码","买入权重","建仓","现价（较建仓）","目标（剩余空间）","推荐日"].forEach(function(h){
    var th = document.createElement("th"); th.textContent = h;
    if (h === "买入权重") th.title = "调仓日等权设定的买入权重；调仓间实际权重随价格自然漂移，调仓日（隔周五）拉回槽位等权";
    htr.appendChild(th);
  });
  thead.appendChild(htr); tb.appendChild(thead);
  var tbody = document.createElement("tbody");
  (mp.holdings||[]).forEach(function(h){
    var tr = document.createElement("tr");
    var td1 = document.createElement("td");
    var tk = document.createElement("span"); tk.className = "tk"; tk.textContent = h.ticker; td1.appendChild(tk);
    var lm = STRATEGY_META[h.lane];
    if (lm){ var c = document.createElement("span"); c.className = "chip "+lm.cls; c.style.marginLeft = "6px"; c.textContent = lm.emoji; td1.appendChild(c); }
    tr.appendChild(td1);
    var td2 = document.createElement("td"); td2.className = "num"; td2.textContent = h.weight != null ? (h.weight*100).toFixed(1)+"%" : "—"; tr.appendChild(td2);
    var td3 = document.createElement("td"); td3.className = "num";
    td3.textContent = fmtMoney(h.entry_px, h.currency);
    if (h.entry_date){ var n3 = document.createElement("span"); n3.className = "nm"; n3.textContent = h.entry_date; td3.appendChild(n3); }
    tr.appendChild(td3);
    var td4 = document.createElement("td"); td4.className = "num";
    td4.appendChild(document.createTextNode(fmtMoney(h.last_price, h.currency)));
    if (h.since_entry != null){ var c4 = document.createElement("span"); c4.className = pctClass(h.since_entry); c4.textContent = " " + fmtPct(h.since_entry); td4.appendChild(c4); }
    tr.appendChild(td4);
    var td5 = document.createElement("td"); td5.className = "num";
    td5.appendChild(document.createTextNode(fmtMoney(h.target, h.currency)));
    if (h.upside != null){ var c5 = document.createElement("span"); c5.className = pctClass(h.upside); c5.textContent = " " + fmtPct(h.upside); td5.appendChild(c5); }
    if (h.target_updated){
      var u5 = document.createElement("span"); u5.className = "nm"; u5.textContent = "月更 " + h.target_updated.slice(5);
      u5.title = "目标价经月度刷新（初始目标价锁定）"; td5.appendChild(u5);
    }
    tr.appendChild(td5);
    var td6 = document.createElement("td"); td6.textContent = h.rec_date || "—"; tr.appendChild(td6);
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody);
  hbox.appendChild(tb);

  // ---- 收益归因（数据缺失时渲染占位，不影响其余） ----
  try { renderPortfolioAttribution(mp.attribution); }
  catch(e){ $("mp-attrib-meta").textContent = "归因渲染失败：" + e.message; }
}

// 组合归因：贡献用 NAV 单位（百分点 pp），Σ 个股贡献 + 成本 = 组合累计收益；与 reports/attribution-portfolio.md 同一份计算
function ppText(x){ return (x == null) ? "—" : ((x >= 0 ? "+" : "") + (x * 100).toFixed(2) + "pp"); }
function ppCell(x){ return { text: ppText(x), cls: (x == null ? "" : pctClass(x)) }; }
function renderPortfolioAttribution(a){
  var box = $("mp-attrib"), meta = $("mp-attrib-meta");
  box.textContent = "";
  if (!a || !a.identity){ meta.textContent = "归因数据缺失（build 时该段失败或尚未生成）"; return; }
  var idn = a.identity, cash = a.cash || {};
  meta.textContent = a.start + " → " + a.end + "，" + a.n_periods + " 个调仓区间，在仓过 " + a.n_stocks_held +
    " 只。贡献 = 区间期初 NAV × 槽位权重 × (腿增长−1)，逐区间相加；Σ个股贡献 + 调仓成本 = 组合累计收益。" +
    "完整报告：reports/attribution-portfolio.md";
  var tiles = document.createElement("div"); tiles.className = "mp-tiles"; box.appendChild(tiles);
  makeTile(tiles, "组合累计收益", fmtPct(idn.total_return), pctClass(idn.total_return), "SPY 同期 " + fmtPct(a.spy_total_return));
  makeTile(tiles, "个股贡献合计", ppText(idn.stock_contrib), pctClass(idn.stock_contrib),
           "正 " + ppText(a.gross_gains) + " / 负 " + ppText(a.gross_losses));
  makeTile(tiles, "调仓成本", ppText(idn.rebalance_costs + idn.initial_cost), "neg", "15bp/边 · 含首建仓");
  makeTile(tiles, "平均现金权重", cash.avg_cash_weight != null ? (cash.avg_cash_weight * 100).toFixed(1) + "%" : "—", null,
           "若持 SPY 可多 " + ppText(cash.cash_opportunity_cost_vs_spy));
  var tw = 0; (a.winners || []).forEach(function(s){ tw += s.contrib; });
  makeTile(tiles, "Top 5 合计", ppText(tw), pctClass(tw),
           a.top_share_of_total != null ? "占总收益 " + Math.round(a.top_share_of_total * 100) + "%" : null);
  var tl = 0; (a.losers || []).forEach(function(s){ tl += s.contrib; });
  makeTile(tiles, "Bottom 5 合计", ppText(tl), pctClass(tl), null);

  function stockRows(items){
    return (items || []).map(function(s){
      return [ { text: s.ticker, sub: (STRATEGY_META[s.strategy] ? STRATEGY_META[s.strategy].emoji + " " : "") + s.channel + " · " + s.sector },
               ppCell(s.contrib), (s.avg_weight * 100).toFixed(1) + "%", String(s.n_periods), pctCell(s.held_return) ];
    });
  }
  var heads = [ { label: "票" }, { label: "贡献", num: true, title: "对组合累计收益的贡献（NAV 单位，百分点）" },
                { label: "平均权重", num: true }, { label: "在仓区间", num: true },
                { label: "持有期间自身收益", num: true, title: "在仓各区间腿增长连乘 − 1（含股息）" } ];
  var grid = document.createElement("div"); grid.className = "attrib-grid"; box.appendChild(grid);
  var w = document.createElement("div"); w.className = "attrib-tbl"; grid.appendChild(w);
  var h3w = document.createElement("h3"); h3w.textContent = "Top 5 winners"; w.appendChild(h3w);
  var wt = document.createElement("div"); w.appendChild(wt); simpleTable(wt, heads, stockRows(a.winners));
  var l = document.createElement("div"); l.className = "attrib-tbl"; grid.appendChild(l);
  var h3l = document.createElement("h3"); h3l.textContent = "Bottom 5 losers"; l.appendChild(h3l);
  var lt = document.createElement("div"); l.appendChild(lt); simpleTable(lt, heads, stockRows(a.losers));

  var gheads = [ { label: "组" }, { label: "票数", num: true }, { label: "贡献", num: true },
                 { label: "占总收益", num: true }, { label: "平均权重", num: true },
                 { label: "贡献÷均重", num: true, title: "≈ 该组资金自身累计收益（近似）" } ];
  function groupRows(rows){
    return (rows || []).map(function(r){
      return [ { text: r.group, sub: tickersSub(r.tickers), title: (r.tickers || []).join(", ") }, String(r.n_tickers), ppCell(r.contrib),
               (idn.total_return > 0 ? Math.round(r.contrib / idn.total_return * 100) + "%" : "—"),
               (r.avg_weight * 100).toFixed(1) + "%", pctCell(r.return_on_capital) ];
    });
  }
  var grid2 = document.createElement("div"); grid2.className = "attrib-grid attrib-grid-3"; box.appendChild(grid2);
  [["by_channel", "按来源渠道"], ["by_strategy", "按策略"], ["by_sector", "按板块"]].forEach(function(it){
    var d = document.createElement("div"); d.className = "attrib-tbl"; grid2.appendChild(d);
    var h = document.createElement("h3"); h.textContent = it[1]; d.appendChild(h);
    var t = document.createElement("div"); d.appendChild(t); simpleTable(t, gheads, groupRows(a[it[0]]));
  });
}

// ---------- 🔬 个股归因（全池固定分组；数字与 reports/attribution-stock-level.md 同一份计算） ----------
// KPI 卡（组合 tab 与归因区块共用）
function makeTile(container, label, val, cls, sub){
  var d = document.createElement("div"); d.className = "mp-tile";
  var l = document.createElement("div"); l.className = "lbl"; l.textContent = label; d.appendChild(l);
  var v = document.createElement("div"); v.className = "val" + (cls ? " "+cls : ""); v.textContent = val; d.appendChild(v);
  if (sub){ var s = document.createElement("div"); s.className = "sub"; s.textContent = sub; d.appendChild(s); }
  container.appendChild(d);
}
function pctOrDash(x){ return (x == null) ? "—" : fmtPct(x); }
function wrText(x){ return (x == null) ? "—" : Math.round(x * 100) + "%"; }
function pctCell(x){ return { text: pctOrDash(x), cls: (x == null ? "" : pctClass(x)) }; }
// 小表：heads = [{label, num, title}]；cell = 字符串 或 {text, cls, sub, title}
function simpleTable(container, heads, rows){
  container.textContent = "";
  var tb = document.createElement("table"), thead = document.createElement("thead"), tr = document.createElement("tr");
  heads.forEach(function(h){
    var th = document.createElement("th"); th.textContent = h.label;
    if (h.num) th.className = "num"; if (h.title) th.title = h.title;
    tr.appendChild(th);
  });
  thead.appendChild(tr); tb.appendChild(thead);
  var tbody = document.createElement("tbody");
  rows.forEach(function(r){
    var trr = document.createElement("tr");
    r.forEach(function(c, i){
      var td = document.createElement("td"); if (heads[i].num) td.className = "num";
      if (c && typeof c === "object"){
        var sp = document.createElement("span"); if (c.cls) sp.className = c.cls; sp.textContent = c.text; td.appendChild(sp);
        if (c.sub){ var s = document.createElement("span"); s.className = "nm"; s.textContent = c.sub; td.appendChild(s); }
        if (c.title) td.title = c.title;
      } else td.textContent = (c == null ? "—" : c);
      trr.appendChild(td);
    });
    tbody.appendChild(trr);
  });
  tb.appendChild(tbody); container.appendChild(tb);
}
function tickersSub(tk){
  tk = tk || [];
  return tk.length > 8 ? tk.slice(0, 8).join(" ") + " …+" + (tk.length - 8) : tk.join(" ");
}
function renderAttribution(a){
  ["attrib-tiles","attrib-hist","attrib-channel","attrib-cohort","attrib-calendar"].forEach(function(id){ $(id).textContent = ""; });
  var meta = $("attrib-meta");
  if (!a || !a.dispersion){ meta.textContent = "归因数据缺失（build 时该段失败或尚未生成）"; return; }
  var blk = a.dispersion["全部正式"] || {}, st = blk.stats || {}, ci = blk.ci95_mean;
  meta.textContent = "口径同底部「平均」行：正式推荐 " + a.n_formal + " 只等权 buy-and-hold（条件推荐 " + a.n_cond +
    " 只不入均值）；全池固定分组，不随上方筛选联动；截至 " + (a.as_of || "—") + "。完整报告：reports/attribution-stock-level.md";

  // ① 离散度：6 张 KPI 卡 + CSS 直方图（10 个百分点分箱）
  var tiles = $("attrib-tiles");
  makeTile(tiles, "正式推荐 n", String(st.n == null ? "—" : st.n), null, "含 VC 观察级");
  makeTile(tiles, "均值", pctOrDash(st.mean), st.mean != null ? pctClass(st.mean) : null,
           ci ? ("95% CI " + pctOrDash(ci.lo) + " ~ " + pctOrDash(ci.hi)) : "样本不足，无 CI");
  makeTile(tiles, "中位", pctOrDash(st.median), st.median != null ? pctClass(st.median) : null,
           "SPY 同期均值 " + pctOrDash(a.spy_mean_same_window));
  makeTile(tiles, "标准差", pctOrDash(st.std), null, "IQR " + pctOrDash(st.iqr));
  makeTile(tiles, "P10 – P90", pctOrDash(st.p10) + " ~ " + pctOrDash(st.p90), null,
           "极值 " + pctOrDash(st.min) + " / " + pctOrDash(st.max));
  makeTile(tiles, "胜率", wrText(st.win_rate), null,
           "盈/亏均 " + pctOrDash(st.avg_win) + " / " + pctOrDash(st.avg_loss) + (st.payoff != null ? "，payoff " + st.payoff.toFixed(2) : ""));
  var hist = blk.hist || [], hbox = $("attrib-hist");
  if (hist.length){
    var maxN = 0; hist.forEach(function(b){ if (b.n > maxN) maxN = b.n; });
    var bars = document.createElement("div"); bars.className = "hist";
    var xs = document.createElement("div"); xs.className = "hist-x";
    hist.forEach(function(b){
      var bar = document.createElement("div");
      bar.className = "bar " + (b.hi <= 0 ? "neg" : (b.lo >= 0 ? "pos" : ""));
      bar.style.height = (maxN ? Math.max(2, Math.round(b.n / maxN * 100)) : 2) + "%";
      bar.title = fmtPct(b.lo) + " ~ " + fmtPct(b.hi) + "：" + b.n + " 只";
      if (b.n){ var n = document.createElement("span"); n.className = "n"; n.textContent = b.n; bar.appendChild(n); }
      bars.appendChild(bar);
      var lab = document.createElement("span"); lab.textContent = Math.round(b.lo * 100) + "%"; xs.appendChild(lab);
    });
    hbox.appendChild(bars); hbox.appendChild(xs);
  }

  // ② 渠道（推荐日归因）+ 另类渠道合计行
  var chRows = (a.by_channel || []).map(function(r){
    return [ { text: r.group + (r.small_sample ? " ⚠" : ""), sub: tickersSub(r.tickers), title: (r.tickers || []).join(", ") },
             String(r.n), pctCell(r.mean), pctCell(r.median), wrText(r.win_rate), pctCell(r.mean_excess),
             { text: pctOrDash(r["mean_r_T+4w"]), cls: r["mean_r_T+4w"] == null ? "" : pctClass(r["mean_r_T+4w"]),
               sub: (r["n_r_T+4w"] != null && r["n_r_T+4w"] !== r.n) ? ("n=" + r["n_r_T+4w"]) : null } ];
  });
  (a.self_vs_alt || []).forEach(function(r){
    if (r.group === "自筛") return;
    chRows.push([ { text: "▸ " + r.group + "合计", sub: tickersSub(r.tickers), title: (r.tickers || []).join(", ") },
                  String(r.n), pctCell(r.mean), pctCell(r.median), wrText(r.win_rate), pctCell(r.mean_excess), pctCell(r["mean_r_T+4w"]) ]);
  });
  simpleTable($("attrib-channel"), [
    { label: "渠道", title: "推荐日归因：推荐日及前 7 天内 sourcing 候选渠道，否则「自筛」。⚠ = n<3 样本不足。另类渠道票全部是 7 月后推荐的，与自筛比较含 cohort 混淆，同期限看 T+4w 列" },
    { label: "n", num: true }, { label: "均值", num: true }, { label: "中位", num: true }, { label: "胜率", num: true },
    { label: "超额 vs SPY", num: true }, { label: "T+4w 均值", num: true, title: "固定持有 20 个交易日，去掉持有期长短的混淆" }
  ], chRows);

  // ③ 时间窗
  simpleTable($("attrib-cohort"), [
    { label: "推荐月", title: "该月推荐的正式票，至今等权均值" }, { label: "n", num: true }, { label: "均值", num: true },
    { label: "胜率", num: true }, { label: "超额 vs SPY", num: true }, { label: "T+4w", num: true }
  ], (a.by_rec_month || []).map(function(r){
    return [ r.group + (r.small_sample ? " ⚠" : ""), String(r.n), pctCell(r.mean), wrText(r.win_rate), pctCell(r.mean_excess), pctCell(r["mean_r_T+4w"]) ];
  }));
  simpleTable($("attrib-calendar"), [
    { label: "日历月", title: "成员 = 推荐日 ≤ 上月末的正式票（当月新入池的下月才计），等权当月区间收益" },
    { label: "池 n", num: true }, { label: "池当月", num: true }, { label: "SPY 当月", num: true }, { label: "超额", num: true }, { label: "月内胜率", num: true }
  ], (a.by_calendar_month || []).map(function(r){
    return [ r.month + (r.partial ? "*" : ""), String(r.n), pctCell(r.pool_ret), pctCell(r.spy_ret), pctCell(r.excess), wrText(r.win_rate) ];
  }));
}

// ---------- Tab 切换 ----------
function switchTab(name){
  var stocks = name === "stocks";
  $("tab-stocks").className = "tab" + (stocks ? " active" : "");
  $("tab-portfolio").className = "tab" + (stocks ? "" : " active");
  $("stocks-note").style.display = stocks ? "" : "none";
  $("controls").style.display = stocks ? "flex" : "none";
  $("tbl").style.display = stocks ? "" : "none";
  $("attrib").style.display = stocks ? "" : "none";
  $("watch").style.display = (stocks && WATCH_VISIBLE) ? "" : "none";
  $("updates").style.display = stocks ? "" : "none";
  $("portfolio").style.display = stocks ? "none" : "block";
  try { sessionStorage.setItem("dash_tab", name); } catch(e){}
  if (stocks) syncHeadTop();
}

function render(data){
  var meta = data.meta || {};
  AS_OF = meta.data_as_of || null;
  var bits = [];
  if (meta.data_as_of) bits.push("数据截至 " + meta.data_as_of);
  if (meta.last_updated) bits.push("更新于 " + meta.last_updated);
  if (meta.spy) bits.push("SPY $" + meta.spy);
  $("status").textContent = bits.join(" · ") || "已加载";

  STOCKS = Array.isArray(data.stocks) ? data.stocks : [];
  // 板块下拉（粗粒度行业；按固定顺序展示，未知板块追加在后）
  var ORDER = ["软件", "AI 产业链", "消费", "其他"];
  var present = {}; STOCKS.forEach(function(s){ var v=s.sector||s.type; if (v) present[v]=1; });
  var ordered = ORDER.filter(function(x){ return present[x]; })
    .concat(Object.keys(present).filter(function(x){ return ORDER.indexOf(x)<0; }).sort());
  var sel = $("typeFilter");
  ordered.forEach(function(tp){
    var o = document.createElement("option"); o.value=tp; o.textContent=tp; sel.appendChild(o);
  });
  sel.onchange = renderBody;
  // 策略下拉（固定顺序，只列实际存在的）
  var stPresent = {}; STOCKS.forEach(function(s){ if (s.strategy) stPresent[s.strategy]=1; });
  var stSel = $("strategyFilter");
  STRATEGY_ORDER.filter(function(x){ return stPresent[x]; })
    .concat(Object.keys(stPresent).filter(function(x){ return STRATEGY_ORDER.indexOf(x)<0; }).sort())
    .forEach(function(sv){
      var meta = STRATEGY_META[sv];
      var o = document.createElement("option"); o.value=sv;
      o.textContent = meta ? meta.emoji+" "+sv : sv;
      stSel.appendChild(o);
    });
  stSel.onchange = renderBody;
  // 渠道下拉（自筛在前，其余按票数降序；只列实际存在的）
  var chCount = {}; STOCKS.forEach(function(s){ var c = channelOf(s); chCount[c] = (chCount[c] || 0) + 1; });
  var chSel = $("channelFilter");
  Object.keys(chCount).sort(function(x, y){
    if (x === "自筛") return -1; if (y === "自筛") return 1;
    return (chCount[y] - chCount[x]) || x.localeCompare(y);
  }).forEach(function(c){
    var o = document.createElement("option"); o.value = c; o.textContent = c + " (" + chCount[c] + ")"; chSel.appendChild(o);
  });
  chSel.onchange = renderBody;
  $("dateFilter").onchange = renderBody;
  $("search").oninput = renderBody;

  buildHead(); renderBody();
  renderWatchlist(data.watchlist);
  renderUpdates(data.updates);
  // 归因区块（数据缺失时渲染占位，不影响其余）
  try { renderAttribution(data.attribution); }
  catch(e){ $("attrib-meta").textContent = "归因渲染失败：" + e.message; }

  $("stocks-note").style.display = "";
  $("controls").style.display = "flex";
  $("tbl").style.display = "";
  $("attrib").style.display = "";
  $("updates").style.display = "";
  syncHeadTop();

  // 组合 tab（数据缺失时也渲染占位提示，tab 始终可见）
  try { renderPortfolio(data.model_portfolio); }
  catch(e){ $("mp-meta").textContent = "组合渲染失败：" + e.message; }
  $("tabs").style.display = "flex";
  $("tab-stocks").onclick = function(){ switchTab("stocks"); };
  $("tab-portfolio").onclick = function(){ switchTab("portfolio"); };
  var saved = null;
  try { saved = sessionStorage.getItem("dash_tab"); } catch(e){}
  if (saved === "portfolio") switchTab("portfolio");
}

// ---------- 引导 ----------
// 口令输入层（掩码显示）：空提交只回焦，不能取消——没有口令看板无内容可看
function askPassphrase(){
  return new Promise(function(resolve){
    var g = $("gate"), inp = $("gate-input");
    g.style.display = "flex";
    inp.focus();
    $("gate-form").onsubmit = function(ev){
      ev.preventDefault();
      var v = inp.value;
      if (!v){ inp.focus(); return; }
      g.style.display = "none";
      resolve(v);
    };
  });
}

async function boot(){
  window.addEventListener("resize", syncHeadTop);
  if (!window.crypto || !crypto.subtle){
    showError("此浏览器不支持 WebCrypto，无法解密。请用现代浏览器（需 HTTPS）。", false);
    return;
  }
  var pp = sessionStorage.getItem("dash_pp");
  if (!pp){
    pp = await askPassphrase();
    sessionStorage.setItem("dash_pp", pp);
  }

  var env;
  try {
    var resp = await fetch("data.enc.json?v=" + Date.now(), { cache:"no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    env = await resp.json();
  } catch(e){
    showError("数据加载失败：" + e.message + "（请稍后硬刷新 Ctrl+Shift+R）", false);
    return;
  }

  var text;
  try {
    text = await decryptEnvelope(env, pp);
  } catch(e){
    showError("解密失败，请检查口令是否正确。", true);
    return;
  }

  var data;
  try {
    data = JSON.parse(text);
  } catch(e){
    showError("数据解析失败（JSON 格式异常）：" + e.message, false);
    return;
  }

  try {
    render(data);
  } catch(e){
    showError("渲染失败：" + e.message, false);
  }
}

boot();
